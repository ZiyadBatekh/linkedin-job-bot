name: Frontend Job Search

# بيشغّل البوت مرتين يوميًا ويبعت الوظائف الجديدة على Telegram.
on:
  schedule:
    # GitHub cron is UTC. These are 08:07 and 20:07 UTC every day.
    - cron: "7 8 * * *"

    - cron: "7 20 * * *"

  # بيخليك تشغّله بإيدك من تاب Actions للتجربة.
  workflow_dispatch:

concurrency:
  group: linkedin-job-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # بيجيب الكود من الريبو
      - name: Check out the repo
        uses: actions/checkout@v4

      # بيسطّب بايثون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # بيسطّب المكتبات
      - name: Install dependencies
        run: pip install -r requirements.txt

      # بيشغّل البوت
      - name: Run the job search
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_search.py

      - name: Persist sent-job memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          if git diff --cached --quiet; then
            echo "No seen-job database changes"
          else
            git commit -m "Update seen jobs database"
            git push origin HEAD:main
          fi
